    // ─── 5. UNIQUE COMPANIES EXTRACTOR VIEW COMPONENT ───────────────────────────
    const UniqueCompaniesView = () => {
      const [file, setFile] = useState(null);
      const [parsing, setParsing] = useState(false);
      const [error, setError] = useState(null);
      const [companies, setCompanies] = useState([]);
      const [uniqueRows, setUniqueRows] = useState([]);
      const [detectedColumn, setDetectedColumn] = useState('');
      const [selectedColumn, setSelectedColumn] = useState('');
      const [availableColumns, setAvailableColumns] = useState([]);
      const [columnHints, setColumnHints] = useState('company_name, company');

      const [downloadingCsv, setDownloadingCsv] = useState(false);
      const [downloadingExcel, setDownloadingExcel] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 10;

      const handleFileChange = (e) => {
        const selectedFile = e.target.files[0];
        if (selectedFile) {
          setFile(selectedFile);
          setError(null);
          setCompanies([]);
          setUniqueRows([]);
          setDetectedColumn('');
          setSelectedColumn('');
          setAvailableColumns([]);
          triggerParse(selectedFile);
        }
      };

      const triggerParse = async (fileToParse, columnOverride = null) => {
        setParsing(true);
        setError(null);
        try {
          const formData = new FormData();
          formData.append('file', fileToParse);

          let url = `${API_BASE}/api/v1/companies/parse`;
          const hint = columnOverride !== null ? columnOverride : columnHints;
          if (hint) {
            url += `?column=${encodeURIComponent(hint)}`;
          }

          const res = await fetch(url, {
            method: 'POST',
            body: formData,
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Failed to parse file');
          }

          setCompanies(data.companies || []);
          setUniqueRows(data.unique_rows || []);
          setDetectedColumn(data.detected_column || '');
          setSelectedColumn(data.detected_column || '');
          setAvailableColumns(data.available_columns || []);
          setCurrentPage(1);
        } catch (err) {
          setError(err.message || 'An error occurred during file parsing');
          console.error(err);
        } finally {
          setParsing(false);
        }
      };

      const handleColumnChange = (e) => {
        const col = e.target.value;
        setSelectedColumn(col);
        if (file) {
          triggerParse(file, col);
        }
      };

      const downloadFile = async (format) => {
        if (companies.length === 0) return;

        if (format === 'csv') setDownloadingCsv(true);
        if (format === 'excel') setDownloadingExcel(true);

        try {
          const res = await fetch(`${API_BASE}/api/v1/companies/download/${format}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              companies: companies,
              column_name: selectedColumn || 'company_name',
              rows: uniqueRows,
              headers: availableColumns
            })
          });

          if (!res.ok) throw new Error('Download failed');

          const blob = await res.blob();
          const downloadUrl = window.URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = downloadUrl;
          link.setAttribute('download', `unique_companies_${new Date().toISOString().slice(0, 10)}.${format === 'csv' ? 'csv' : 'xlsx'}`);
          document.body.appendChild(link);
          link.click();
          link.parentNode.removeChild(link);
        } catch (err) {
          setError(`Failed to download ${format.toUpperCase()} file`);
          console.error(err);
        } finally {
          if (format === 'csv') setDownloadingCsv(false);
          if (format === 'excel') setDownloadingExcel(false);
        }
      };

      // Filtered companies based on search
      const filteredCompanies = useMemo(() => {
        if (!searchTerm.trim()) return companies;
        const norm = searchTerm.toLowerCase();
        return companies.filter(c => c.toLowerCase().includes(norm));
      }, [companies, searchTerm]);

      // Paginated items
      const paginatedCompanies = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredCompanies.slice(start, start + pageSize);
      }, [filteredCompanies, currentPage, pageSize]);

      const totalPages = Math.ceil(filteredCompanies.length / pageSize) || 1;

      const currentColumnLabel = useMemo(() => {
        if (!selectedColumn) return 'Company';
        return selectedColumn
          .split('_')
          .map(w => w.charAt(0).toUpperCase() + w.slice(1))
          .join(' ');
      }, [selectedColumn]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-2">
                <LucideIcon name="Building" className="w-7 h-7 text-indigo-400" />
                <span>Unique Company Extractor</span>
              </h2>
              <p className="text-sm text-slate-400">
                Upload a CSV or Excel file to extract unique company names and enrich them with Apollo.io data.
              </p>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Upload Zone, Config, and Apollo Enrichment */}
            <div className="lg:col-span-1 space-y-6">
              {/* Card 1: Upload & Export */}
              <div className="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-md space-y-4 text-left">
                <div>
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-350 mb-3 flex items-center space-x-2">
                    <LucideIcon name="UploadCloud" className="w-4 h-4 text-indigo-400" />
                    <span>Upload Document</span>
                  </h3>

                  {/* Dropzone */}
                  <div className="border-2 border-dashed border-slate-800/50 hover:border-indigo-500/50 rounded-xl p-5 text-center transition-all bg-slate-955/20 relative cursor-pointer group">
                    <input
                      type="file"
                      accept=".csv, .xlsx, .xls"
                      onChange={handleFileChange}
                      className="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10"
                    />
                    <div className="space-y-2.5">
                      <div className="bg-indigo-500/10 p-2 rounded-lg border border-indigo-500/20 text-indigo-400 w-10 h-10 flex items-center justify-center mx-auto group-hover:scale-110 transition-transform">
                        <LucideIcon name="FileSpreadsheet" className="w-5 h-5" />
                      </div>
                      <div>
                        <p className="text-xs font-bold text-slate-200">
                          {file ? file.name : "Choose CSV or Excel file"}
                        </p>
                        <p className="text-[10px] text-slate-500 mt-0.5">
                          Drag and drop or click to browse
                        </p>
                      </div>
                      {file && (
                        <div className="text-[10px] text-slate-400 font-mono bg-slate-900 border border-slate-850 px-2 py-0.5 rounded-md inline-block">
                          {(file.size / 1024).toFixed(1)} KB
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                {/* Column Name Preference Hints */}
                <div className="space-y-1.5">
                  <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <LucideIcon name="Settings" className="w-3.5 h-3.5 text-indigo-400" />
                    <span>Search Preference Hints</span>
                  </label>
                  <div className="relative">
                    <input
                      type="text"
                      value={columnHints}
                      onChange={(e) => setColumnHints(e.target.value)}
                      placeholder="company_name, company"
                      className="w-full bg-slate-950/60 border border-slate-800 rounded-xl pl-3 pr-20 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20"
                    />
                    {file && (
                      <button
                        onClick={() => triggerParse(file)}
                        className="absolute right-1.5 top-1/2 -translate-y-1/2 px-2.5 py-1 rounded bg-indigo-650 hover:bg-indigo-600 text-[10px] font-bold text-white transition-all active:scale-95"
                      >
                        Apply
                      </button>
                    )}
                  </div>
                  <p className="text-[9px] text-slate-500">
                    Prioritized comma-separated names to auto-detect.
                  </p>
                </div>

                {error && (
                  <div className="p-3 rounded-xl border border-rose-500/20 bg-rose-500/5 text-[11px] text-rose-400 font-medium flex items-start gap-2 animate-in fade-in slide-in-from-top-1 duration-200">
                    <LucideIcon name="AlertTriangle" className="w-3.5 h-3.5 shrink-0 text-rose-500" />
                    <span>{error}</span>
                  </div>
                )}

                {/* Column Selection Configuration */}
                {availableColumns.length > 0 && (
                  <div className="pt-3.5 border-t border-slate-800/40 space-y-1.5 animate-in fade-in duration-300">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                      <LucideIcon name="Grid" className="w-3.5 h-3.5 text-indigo-400" />
                      <span>Company Column</span>
                    </label>
                    <select
                      value={selectedColumn}
                      onChange={handleColumnChange}
                      className="bg-slate-950 border border-slate-850 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20 w-full"
                    >
                      {availableColumns.map((col, idx) => (
                        <option key={idx} value={col}>
                          {col} {col === detectedColumn ? " (Auto-Detected)" : ""}
                        </option>
                      ))}
                    </select>
                  </div>
                )}
                {/* Export Results Section */}
                {companies.length > 0 && (
                  <div className="pt-4 border-t border-slate-800/40 space-y-3 animate-in fade-in duration-300">
                    <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center space-x-2">
                      <LucideIcon name="Download" className="w-3.5 h-3.5 text-indigo-400" />
                      <span>Export Unique Companies</span>
                    </h3>
                    <div className="flex flex-col gap-2">
                      <button
                        onClick={() => downloadFile('csv')}
                        disabled={downloadingCsv}
                        className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-slate-850 hover:border-slate-700 hover:bg-slate-800 hover:text-white transition-all active:scale-95 disabled:opacity-50"
                      >
                        <LucideIcon name={downloadingCsv ? "Loader" : "FileText"} className={`w-3.5 h-3.5 text-slate-450 ${downloadingCsv ? 'animate-spin' : ''}`} />
                        <span>{downloadingCsv ? "Preparing CSV..." : "Download Unique CSV"}</span>
                      </button>
                      <button
                        onClick={() => downloadFile('excel')}
                        disabled={downloadingExcel}
                        className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white transition-all active:scale-95 disabled:opacity-50 shadow-md shadow-indigo-600/5 hover:shadow-indigo-600/15"
                      >
                        <LucideIcon name={downloadingExcel ? "Loader" : "Table"} className={`w-3.5 h-3.5 ${downloadingExcel ? 'animate-spin' : ''}`} />
                        <span>{downloadingExcel ? "Preparing Excel..." : "Download Unique Excel"}</span>
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Results Preview Card */}
            <div className="lg:col-span-2">
              <div className="glass-panel rounded-2xl border border-slate-800/80 shadow-md overflow-hidden min-h-[300px] flex flex-col justify-between">
                <div>
                  <div className="px-6 py-4 border-b border-slate-800/80 bg-slate-950/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div className="flex items-center space-x-3">
                      <div className="flex items-center space-x-2.5">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-350">
                          Preview Unique {currentColumnLabel === 'Company' ? 'Companies' : (currentColumnLabel.endsWith('s') ? currentColumnLabel : currentColumnLabel + 's')}
                        </h3>
                        {companies.length > 0 && (
                          <span className="text-xs bg-indigo-500/10 border border-indigo-500/25 px-2.5 py-0.5 rounded-full text-indigo-400 font-bold">
                            {companies.length} Found
                          </span>
                        )}
                      </div>
                    </div>
                    {companies.length > 0 && (
                      <div className="relative w-full sm:w-60">
                        <input
                          type="text"
                          placeholder="Filter preview list..."
                          value={searchTerm}
                          onChange={(e) => {
                            setSearchTerm(e.target.value);
                            setCurrentPage(1);
                          }}
                          className="w-full bg-slate-950/60 border border-slate-850 rounded-lg pl-3 pr-8 py-1.5 text-xs text-white placeholder-slate-505 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/25 transition-all"
                        />
                        {searchTerm && (
                          <button
                            onClick={() => setSearchTerm('')}
                            className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white"
                          >
                            <LucideIcon name="X" className="w-3.5 h-3.5" />
                          </button>
                        )}
                      </div>
                    )}
                  </div>

                  <div className="overflow-x-auto custom-scrollbar">
                    {parsing ? (
                      <div className="flex flex-col items-center justify-center py-24 text-slate-400 space-y-4">
                        <LucideIcon name="Loader" className="w-10 h-10 text-indigo-505 animate-spin" strokeWidth={1.5} />
                        <span className="text-sm font-medium">
                          Analyzing file and filtering unique company list...
                        </span>
                      </div>
                    ) : companies.length === 0 ? (
                      <div className="flex flex-col items-center justify-center py-24 text-slate-500 space-y-3.5 text-center px-6">
                        <LucideIcon name="FileSpreadsheet" className="w-12 h-12 text-slate-855 animate-pulse" strokeWidth={1.5} />
                        <div>
                          <p className="text-sm font-semibold text-slate-400">No Data Imported Yet</p>
                          <p className="text-xs text-slate-500 mt-1 max-w-sm">
                            Upload your CSV or Excel file containing job listings or organizations using the panel on the left to start extracting unique companies.
                          </p>
                        </div>
                      </div>
                    ) : (
                      // RAW PREVIEW TABLE
                      filteredCompanies.length === 0 ? (
                        <div className="flex flex-col items-center justify-center py-24 text-slate-500 space-y-2 text-center">
                          <LucideIcon name="Search" className="w-10 h-10 text-slate-800" strokeWidth={1.5} />
                          <span className="text-sm">No matches found.</span>
                        </div>
                      ) : (
                        <table className="w-full text-left border-collapse">
                          <thead>
                            <tr className="border-b border-slate-800 text-[10px] uppercase tracking-wider text-slate-400 bg-slate-950/40">
                              <th className="px-6 py-3 font-bold w-16">#</th>
                              <th className="px-6 py-3 font-bold">{currentColumnLabel}</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/40">
                            {paginatedCompanies.map((company, index) => {
                              const serial = (currentPage - 1) * pageSize + index + 1;
                              return (
                                <tr key={index} className="hover:bg-slate-900/20 transition-colors">
                                  <td className="px-6 py-3 text-xs font-mono text-slate-500 font-semibold">{serial}</td>
                                  <td className="px-6 py-3 text-sm font-medium text-slate-200">{company}</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      )
                    )}
                  </div>
                </div>

                {companies.length > 0 && filteredCompanies.length > 0 && (
                  <div className="px-6 py-4 border-t border-slate-900/60 bg-slate-950/20 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <span className="text-xs text-slate-505 font-semibold">
                      Showing {(currentPage - 1) * pageSize + 1} - {Math.min(currentPage * pageSize, filteredCompanies.length)} of {filteredCompanies.length} records
                    </span>
                    {totalPages > 1 && (
                      <div className="flex items-center space-x-1">
                        <button
                          onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                          disabled={currentPage === 1}
                          className="p-1.5 bg-slate-950 border border-slate-850 rounded-lg text-slate-400 hover:text-white disabled:opacity-30 transition-all"
                        >
                          <LucideIcon name="ChevronLeft" className="w-4 h-4" />
                        </button>
                        <span className="text-xs text-slate-400 px-2 font-bold font-mono">
                          {currentPage} / {totalPages}
                        </span>
                        <button
                          onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                          disabled={currentPage === totalPages}
                          className="p-1.5 bg-slate-950 border border-slate-850 rounded-lg text-slate-400 hover:text-white disabled:opacity-30 transition-all"
                        >
                          <LucideIcon name="ChevronRight" className="w-4 h-4" />
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ─── APOLLO ENRICHMENT VIEW ──────────────────────────────────────────────────
    const ApolloEnrichmentView = () => {
      const [file, setFile] = useState(null);
      const [apolloKey, setApolloKey] = useState(
        () => localStorage.getItem('remoteio_apollo_api_key') || ''
      );
      const [showKey, setShowKey] = useState(false);
      const [step, setStep] = useState('idle');
      const [companies, setCompanies] = useState([]);
      const [uniqueRows, setUniqueRows] = useState([]);
      const [enriched, setEnriched] = useState([]);
      const [error, setError] = useState(null);
      const [search, setSearch] = useState('');
      const [page, setPage] = useState(1);
      const [enrichLimit, setEnrichLimit] = useState(50);
      const PAGE = 15;

      const effectiveLimit = enrichLimit === 0 ? companies.length : Math.min(enrichLimit, companies.length);

      // Build company -> country map from parsed rows (for Apollo hint, no extra credits)
      const companyCountries = useMemo(() => {
        const map = {};
        uniqueRows.forEach(row => {
          const name = row['Company'] || row['Company Name'] || '';
          const country = (row['Company Country'] || '').split('\n')[0].trim();
          if (name && country) map[name] = country;
        });
        return map;
      }, [uniqueRows]);

      const stats = useMemo(() => {
        const s = enriched.filter(x => x.status === 'success').length;
        const n = enriched.filter(x => x.status === 'not_found').length;
        const e = enriched.filter(x => x.status !== 'success' && x.status !== 'not_found').length;
        return { success: s, notFound: n, errors: e };
      }, [enriched]);

      const parseFile = async (f) => {
        setStep('parsing'); setError(null); setCompanies([]); setEnriched([]);
        try {
          const fd = new FormData();
          fd.append('file', f);
          const res = await fetch(API_BASE + '/api/v1/companies/parse', { method: 'POST', body: fd });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Parse failed');
          setCompanies(data.companies || []);
          setUniqueRows(data.unique_rows || []);
          setStep('ready');
          setPage(1);
        } catch (err) {
          setError(err.message);
          setStep('idle');
        }
      };

      const handleFileChange = (e) => {
        const f = e.target.files[0];
        if (f) { setFile(f); parseFile(f); }
      };

      const handleEnrich = async () => {
        if (!companies.length) return;
        setStep('enriching'); setError(null); setEnriched([]);
        try {
          const res = await fetch(API_BASE + '/api/v1/companies/enrich', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              companies: companies,
              api_key: apolloKey || null,
              limit: enrichLimit === 0 ? null : enrichLimit,
              company_countries: companyCountries
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Enrichment failed');
          setEnriched(data.enriched || []);
          setStep('done');
          setPage(1);
        } catch (err) {
          setError(err.message);
          setStep('ready');
        }
      };

      const downloadEnriched = async (fmt) => {
        const hdrs = [
          "Input Company", "Matched Name", "Match Confidence",
          "Domain", "Website", "Industry", "Employees", "Founded",
          "LinkedIn", "Twitter", "Facebook", "Phone",
          "Apollo ID", "Market Cap", "Publicly Traded Symbol", "Status"
        ];
        const rows = enriched.map(c => ({
          "Input Company": c.input_company_name || '',
          "Matched Name": c.matched_name || '',
          "Match Confidence": c.match_confidence || '',
          "Domain": c.domain || '',
          "Website": c.website_url || '',
          "Industry": c.industry || '',
          "Employees": c.estimated_num_employees || '',
          "Founded": c.founded_year || '',
          "LinkedIn": c.linkedin_url || '',
          "Twitter": c.twitter_url || '',
          "Facebook": c.facebook_url || '',
          "Phone": c.phone || '',
          "Apollo ID": c.organization_id || '',
          "Market Cap": c.market_cap || '',
          "Publicly Traded Symbol": c.publicly_traded_symbol || '',
          "Status": c.status || ''
        }));
        try {
          const res = await fetch(API_BASE + '/api/v1/companies/download/' + fmt, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ companies: companies, column_name: 'company_name', rows: rows, headers: hdrs })
          });
          if (!res.ok) return;
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'apollo_enriched_' + new Date().toISOString().slice(0, 10) + '.' + (fmt === 'csv' ? 'csv' : 'xlsx');
          document.body.appendChild(a);
          a.click();
          a.remove();
        } catch (err) {
          setError('Download failed: ' + err.message);
        }
      };

      const filtered = useMemo(() => {
        const src = step === 'done'
          ? enriched
          : companies.map(c => ({ input_company_name: c }));
        if (!search.trim()) return src;
        const q = search.toLowerCase();
        return src.filter(c =>
          (c.input_company_name || '').toLowerCase().includes(q) ||
          (c.matched_name || '').toLowerCase().includes(q) ||
          (c.domain || '').toLowerCase().includes(q) ||
          (c.industry || '').toLowerCase().includes(q)
        );
      }, [enriched, companies, step, search]);

      const totalPages = Math.ceil(filtered.length / PAGE) || 1;
      const paginated = filtered.slice((page - 1) * PAGE, page * PAGE);

      const isLoading = step === 'parsing' || step === 'enriching';

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2.5">
                <div className="bg-violet-500/10 p-2 rounded-xl border border-violet-500/20">
                  <LucideIcon name="Sparkles" className="w-6 h-6 text-violet-400" />
                </div>
                <span className="bg-clip-text text-transparent bg-gradient-to-r from-violet-300 to-white">
                  Apollo Enrichment
                </span>
              </h2>
              <p className="text-sm text-slate-400 mt-1 ml-[52px]">
                Upload a CSV or Excel file, add your Apollo API key, and enrich company data instantly.
              </p>
            </div>
            {step === 'done' && (
              <div className="flex gap-2">
                <button
                  onClick={() => downloadEnriched('csv')}
                  className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-slate-800 hover:border-slate-700 hover:bg-slate-800 text-slate-300 hover:text-white transition-all active:scale-95"
                >
                  <LucideIcon name="FileText" className="w-3.5 h-3.5" />
                  <span>Export CSV</span>
                </button>
                <button
                  onClick={() => downloadEnriched('excel')}
                  className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-500 hover:to-purple-500 text-white shadow-md transition-all active:scale-95"
                >
                  <LucideIcon name="Table" className="w-3.5 h-3.5" />
                  <span>Export Excel</span>
                </button>
              </div>
            )}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="space-y-5">
              <div className="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-md space-y-4">
                <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <LucideIcon name="UploadCloud" className="w-4 h-4 text-violet-400" />
                  <span>1. Upload File</span>
                </h3>
                <div className="border-2 border-dashed border-slate-800/60 hover:border-violet-500/40 rounded-xl p-6 text-center relative cursor-pointer transition-all group bg-slate-950/20">
                  <input
                    type="file"
                    accept=".csv,.xlsx,.xls"
                    onChange={handleFileChange}
                    className="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10"
                  />
                  <div className="space-y-2">
                    <div className="w-11 h-11 mx-auto rounded-xl border bg-violet-500/10 border-violet-500/20 text-violet-400 flex items-center justify-center group-hover:scale-105 transition-transform">
                      <LucideIcon name="FileSpreadsheet" className="w-5 h-5" />
                    </div>
                    <p className="text-xs font-semibold text-slate-200">
                      {file ? file.name : 'Click or drop CSV / Excel file'}
                    </p>
                    <p className="text-[10px] text-slate-500">
                      {file ? ((file.size / 1024).toFixed(1) + ' KB') : 'Supports .csv, .xlsx, .xls'}
                    </p>
                  </div>
                </div>

                {step === 'parsing' && (
                  <div className="flex items-center gap-2 text-xs text-violet-400 font-medium">
                    <LucideIcon name="Loader" className="w-4 h-4 animate-spin" />
                    <span>Parsing file...</span>
                  </div>
                )}

                {(step === 'ready' || step === 'done') && companies.length > 0 && (
                  <div className="p-3 rounded-xl bg-emerald-500/5 border border-emerald-500/15 flex items-center gap-2">
                    <LucideIcon name="CheckCircle" className="w-4 h-4 text-emerald-400 shrink-0" />
                    <span className="text-xs text-emerald-300 font-semibold">
                      {companies.length} unique companies detected
                    </span>
                  </div>
                )}

                {error && (
                  <div className="p-3 rounded-xl bg-rose-500/5 border border-rose-500/15 flex items-start gap-2">
                    <LucideIcon name="AlertTriangle" className="w-4 h-4 text-rose-400 shrink-0" />
                    <span className="text-xs text-rose-300">{error}</span>
                  </div>
                )}
              </div>

              <div className="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-md space-y-4">
                <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <LucideIcon name="Key" className="w-4 h-4 text-violet-400" />
                  <span>2. Apollo API Key</span>
                </h3>
                <div className="relative">
                  <input
                    type={showKey ? 'text' : 'password'}
                    value={apolloKey}
                    onChange={(e) => {
                      setApolloKey(e.target.value);
                      localStorage.setItem('remoteio_apollo_api_key', e.target.value);
                    }}
                    placeholder="Paste Apollo.io API key..."
                    className="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-3 pr-10 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-violet-500 transition-all"
                  />
                  <button
                    onClick={() => setShowKey(v => !v)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors"
                  >
                    <LucideIcon name={showKey ? 'EyeOff' : 'Eye'} className="w-3.5 h-3.5" />
                  </button>
                </div>
                <p className="text-[10px] text-slate-500 leading-relaxed">
                  Saved in browser. Leave blank to use server APOLLO_API_KEY env var.
                </p>
              </div>

              <div className="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-md space-y-3">
                <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <LucideIcon name="SlidersHorizontal" className="w-4 h-4 text-violet-400" />
                  <span>3. Fetch Limit</span>
                </h3>
                <div className="flex flex-wrap gap-2">
                  {[25, 50, 100, 0].map(v => (
                    <button
                      key={v}
                      onClick={() => setEnrichLimit(v)}
                      className={
                        'flex-1 min-w-[48px] py-1.5 rounded-lg text-xs font-bold border transition-all ' +
                        (enrichLimit === v
                          ? 'bg-violet-600 border-violet-500 text-white shadow-md'
                          : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-violet-500/50 hover:text-violet-300')
                      }
                    >
                      {v === 0 ? 'All' : v}
                    </button>
                  ))}
                </div>
                <div className="flex items-center gap-2">
                  <label className="text-[10px] text-slate-500 font-semibold shrink-0">Custom:</label>
                  <input
                    type="number"
                    min="1"
                    max={companies.length || 9999}
                    value={enrichLimit === 0 ? '' : enrichLimit}
                    placeholder="e.g. 75"
                    onChange={e => {
                      const v = parseInt(e.target.value, 10);
                      if (!isNaN(v) && v > 0) setEnrichLimit(v);
                      else if (e.target.value === '') setEnrichLimit(0);
                    }}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-violet-500/60 placeholder-slate-600"
                  />
                </div>
                {companies.length > 0 && (
                  <p className="text-[10px] text-slate-500 leading-relaxed">
                    Will fetch <span className="text-violet-400 font-bold">{effectiveLimit}</span> of <span className="font-bold text-slate-400">{companies.length}</span> companies — uses <span className="text-violet-400 font-bold">{effectiveLimit}</span> Apollo credit{effectiveLimit !== 1 ? 's' : ''}.
                  </p>
                )}
              </div>

              <button
                onClick={handleEnrich}
                disabled={!companies.length || step === 'enriching'}
                className="w-full flex items-center justify-center gap-2.5 px-4 py-3.5 rounded-2xl text-sm font-bold bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-500 hover:to-purple-500 text-white shadow-lg transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed border border-violet-500/30"
              >
                <LucideIcon
                  name={step === 'enriching' ? 'Loader' : 'Zap'}
                  className={'w-4 h-4' + (step === 'enriching' ? ' animate-spin' : '')}
                />
                <span>
                  {step === 'enriching'
                    ? 'Enriching via Apollo...'
                    : (companies.length
                      ? 'Enrich ' + effectiveLimit + (effectiveLimit < companies.length ? ' of ' + companies.length : '') + ' Companies'
                      : 'Enrich Companies')}
                </span>
              </button>

              {step === 'done' && (

                { label: 'Bulk Enrich', value: 'Unlimited', note: 'Paid plans' },
              ].map((item, i) => (
                <div key={i} className="bg-slate-950/40 border border-slate-800 rounded-xl p-3 text-center">
                  <p className="text-sm font-bold text-slate-200">{item.value}</p>
                  <p className="text-[10px] text-slate-500 mt-0.5">{item.label}</p>
                  <p className="text-[9px] text-slate-600 uppercase tracking-wider font-bold mt-1">{item.note}</p>
                </div>
              ))}
            </div>
            <p className="text-[11px] text-slate-500 leading-relaxed">
              With 302 companies and a free plan (50 credits/mo), use the <strong className="text-slate-300">Fetch Limit</strong> option in Apollo Enrichment to process companies in batches across months, or upgrade to a paid plan for bulk processing.
            </p>
          </div>

        </div>
      );
    };


    // Render the React application
    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
