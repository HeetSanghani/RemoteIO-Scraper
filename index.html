      if (!country) return "🌐";

    const categoryBadgeStyles = {

      'software development': 'bg-blue-500/10 text-blue-400 border border-blue-500/20',

      if (!category) return categoryBadgeStyles['other'];
      const normalized = category.toLowerCase().trim();

    }

    function formatRelativeTime(dateString) {
      if (!dateString) return "N/A";
      try {
        const date = new Date(dateString);
        const now = new Date();
        if (isNaN(date.getTime())) return dateString;

        const diffMs = now.getTime() - date.getTime();
        const diffSecs = Math.floor(diffMs / 1000);
        const diffMins = Math.floor(diffSecs / 60);
        const diffHours = Math.floor(diffMins / 60);
        const diffDays = Math.floor(diffHours / 24);

        if (diffSecs < 60) return "Just now";
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        if (diffDays === 1) return "Yesterday";
        if (diffDays < 7) return `${diffDays}d ago`;

        return date.toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });
      } catch (e) {
        return dateString;
      }
    }

    function formatDuration(startStr, endStr) {
      if (!startStr || !endStr) return "N/A";
      try {
        const start = new Date(startStr);
        const end = new Date(endStr);
        if (isNaN(start.getTime()) || isNaN(end.getTime())) return "N/A";

        const diffMs = end.getTime() - start.getTime();
        if (diffMs < 0) return "0s";

        const diffSecs = Math.floor(diffMs / 1000);
        const diffMins = Math.floor(diffSecs / 60);

        if (diffSecs < 60) return `${diffSecs}s`;
        const remainingSecs = diffSecs % 60;
        return `${diffMins}m ${remainingSecs}s`;
      } catch (e) {
        return "N/A";
      }
    }

    // ─── DYNAMIC LUCIDE ICON WRAPPER ─────────────────────────────────────────────
    const LucideIcon = ({ name, className = "w-5 h-5", size, strokeWidth = 2 }) => {
      const iconDef = useMemo(() => {
        if (!window.lucide || !window.lucide.icons) return null;
        // Normalize name to search case-insensitively
        const target = name.toLowerCase().replace(/[^a-z0-9]/g, '');
        const key = Object.keys(window.lucide.icons).find(k => k.toLowerCase() === target);
        return key ? window.lucide.icons[key] : null;
      }, [name]);

      if (!iconDef) {
        return <span className={className}>?</span>;
      }

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          style={size ? { width: size, height: size } : {}}
        >
          {iconDef.map(([tag, attrs], idx) => React.createElement(tag, { key: idx, ...attrs }))}
        </svg>
      );
    };

    // ─── CHART.JS REACT COMPONENT WRAPPERS ──────────────────────────────────────
    const BarChart = ({ labels, data, datasetLabel = "Count", horizontal = false, glowColor = 'rgba(99, 102, 241, 0.4)' }) => {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (canvasRef.current) {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }

          const ctx = canvasRef.current.getContext('2d');
          chartInstanceRef.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: datasetLabel,
                data: data,
                backgroundColor: 'rgba(99, 102, 241, 0.65)',
                borderColor: '#818cf8',
                borderWidth: 1.5,
                borderRadius: 6,

            options: {
              indexAxis: horizontal ? 'y' : 'x',
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: '#1e293b',
                  titleFont: { family: 'Inter', weight: 'bold' },
                  bodyFont: { family: 'Inter' },
                  borderColor: 'rgba(255,255,255,0.08)',
                  borderWidth: 1,
                  padding: 10,
                  displayColors: false
                }
              },
              scales: {
                x: {
                  grid: { color: 'rgba(255, 255, 255, 0.03)' },
                  ticks: { color: '#94a3b8', font: { family: 'Inter', size: 10 } }
                },
                y: {
                  grid: { color: 'rgba(255, 255, 255, 0.03)' },
                  ticks: { color: '#94a3b8', font: { family: 'Inter', size: 10 } }
                }
              }
            }
          });
        }
        return () => {
          if (chartInstanceRef.current) {

    };

    // ─── MAIN COMPONENT ──────────────────────────────────────────────────────────
    const App = () => {
      const [activeTab, setActiveTab] = useState('scraper'); // dashboard | jobs | analytics
      const [healthStatus, setHealthStatus] = useState('checking'); // online | offline | checking
      const [apiKey, setApiKey] = useState(localStorage.getItem('remoteio_api_key') || '');
      const [analyticsData, setAnalyticsData] = useState(null);
      const [filterOptions, setFilterOptions] = useState({ categories: [], countries: [], companies: [] });
      const [jobsData, setJobsData] = useState({ jobs: [], total: 0, total_pages: 1 });
      const [jobsLoading, setJobsLoading] = useState(true);
      const [analyticsLoading, setAnalyticsLoading] = useState(true);
      const [jobsError, setJobsError] = useState(null);
      const [analyticsError, setAnalyticsError] = useState(null);
      const [selectedJob, setSelectedJob] = useState(null);
      const [quickScraping, setQuickScraping] = useState(false);
      const [quickScrapeMsg, setQuickScrapeMsg] = useState(null);

      // Jobs Page Query Params State
      const [searchTerm, setSearchTerm] = useState('');
      const [debouncedSearch, setDebouncedSearch] = useState('');
      const [selectedCountry, setSelectedCountry] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('');
      const [selectedCompany, setSelectedCompany] = useState('');
      const [sortBy, setSortBy] = useState('published_at');
      const [sortOrder, setSortOrder] = useState('desc');
      const [currentPage, setCurrentPage] = useState(1);
      const [pageSize] = useState(20);

      // Debounce effect
      useEffect(() => {
        const t = setTimeout(() => {
          setDebouncedSearch(searchTerm);
        }, 300);
        return () => clearTimeout(t);
      }, [searchTerm]);

      // Health status check
      const verifyApiHealth = async () => {
        try {
          const res = await fetch(`${API_BASE}/health`);
          if (res.ok) {
            setHealthStatus('online');
          } else {
            setHealthStatus('offline');
          }
        } catch (err) {
          setHealthStatus('offline');
        }
      };

      useEffect(() => {
        verifyApiHealth();
        const interval = setInterval(verifyApiHealth, 30000);
        return () => clearInterval(interval);
      }, []);

      // Fetch analytics
      const fetchAnalytics = async () => {
        setAnalyticsLoading(true);
        setAnalyticsError(null);
        try {
          const res = await fetch(`${API_BASE}/api/v1/analytics`);
          if (!res.ok) {
            throw new Error(`Analytics server responded with status: ${res.status}`);
          }
          const data = await res.json();
          setAnalyticsData(data);
        } catch (err) {
          setAnalyticsError("Could not load analytics. Is the server running?");
          console.error(err);
        } finally {
          setAnalyticsLoading(false);
        }
      };

      const fetchFilters = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/filters`);
          if (!res.ok) return;
          const data = await res.json();
          setFilterOptions(data);
        } catch (err) {
          console.error('Failed to load filter options', err);
        }
      };

      useEffect(() => {
        fetchAnalytics();
        fetchFilters();
        const refreshInterval = setInterval(fetchAnalytics, 60000);
        return () => clearInterval(refreshInterval);
      }, []);  // eslint-disable-line

      // Reset page when search or filters change
      useEffect(() => {
        setCurrentPage(1);
      }, [debouncedSearch, selectedCountry, selectedCategory, selectedCompany, sortBy, sortOrder]);

      // Fetch jobs
      const fetchJobs = async () => {
        setJobsLoading(true);
        setJobsError(null);
        try {
          let url = `${API_BASE}/api/v1/jobs/`;
          const params = new URLSearchParams({
            page: currentPage.toString(),
            page_size: pageSize.toString(),
            sort_by: sortBy,
            sort_order: sortOrder
          });

          const hasKeyword = debouncedSearch.trim() !== '';
          const hasFilters = selectedCountry || selectedCategory || selectedCompany;

          if (hasKeyword) {
            url = `${API_BASE}/api/v1/jobs/search`;
            params.append('keyword', debouncedSearch.trim());
            if (selectedCountry) params.append('country', selectedCountry);
            if (selectedCategory) params.append('category', selectedCategory);
          } else if (hasFilters) {
            url = `${API_BASE}/api/v1/jobs/filter`;
            if (selectedCountry) params.append('country', selectedCountry);
            if (selectedCategory) params.append('category', selectedCategory);
            if (selectedCompany) params.append('company', selectedCompany);
          }

          const res = await fetch(`${url}?${params.toString()}`);
          if (!res.ok) {
            throw new Error(`Jobs server responded with status: ${res.status}`);
          }
          const data = await res.json();

          // Client-side fallback for company search filter if search endpoint is used (API compatibility)
          let processedJobs = data.jobs || [];
          if (hasKeyword && selectedCompany) {
            processedJobs = processedJobs.filter(
              j => j.company_name && j.company_name.toLowerCase().trim() === selectedCompany.toLowerCase().trim()
            );
          }

          setJobsData({
            jobs: processedJobs,
            total: data.total || 0,
            total_pages: data.total_pages || 1
          });
        } catch (err) {
          setJobsError("Could not load jobs. Is the server running?");
          console.error(err);
        } finally {
          setJobsLoading(false);
        }
      };

      useEffect(() => {
        fetchJobs();
      }, [currentPage, debouncedSearch, selectedCountry, selectedCategory, selectedCompany, sortBy, sortOrder]);

      // Calculate last scraped time dynamically
      const lastScrapedTime = useMemo(() => {
        if (analyticsData && analyticsData.scrape_history && analyticsData.scrape_history.length > 0) {
          const successes = analyticsData.scrape_history.filter(x => x.status === 'success' || x.status === 'completed');
          if (successes.length > 0) {
            return formatRelativeTime(successes[0].completed_at || successes[0].started_at);
          }
        }
        if (jobsData && jobsData.jobs && jobsData.jobs.length > 0) {
          return formatRelativeTime(jobsData.jobs[0].scraped_at);
        }
        return "Never";
      }, [analyticsData, jobsData]);

      // Quick scrape from navbar (default params, 30 jobs)
      // Uses the new async task-dispatch pattern: POST → get task_id → poll until done.
      const handleQuickScrape = async () => {
        if (quickScraping) return;
        setQuickScraping(true);
        setQuickScrapeMsg(null);
        try {
          // Step 1: dispatch the task
          const res = await fetch(`${API_BASE}/api/v1/jobs/scrape`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(apiKey ? { 'X-API-Key': apiKey } : {})
            },
            body: JSON.stringify({ limit: 30 })
          });
          const dispatched = await res.json();
          if (!res.ok) throw new Error(dispatched.detail || 'Scrape dispatch failed');

          // Step 2: poll until the worker finishes (max 3 min)
          const taskId = dispatched.task_id;
          const deadline = Date.now() + 3 * 60 * 1000;
          let result = null;
          while (Date.now() < deadline) {
            await new Promise(r => setTimeout(r, 2000));

                        badgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                      } else if (statusVal === 'failed' || statusVal === 'error') {
                        badgeClass = "bg-rose-500/10 text-rose-400 border border-rose-500/20";
                      } else if (statusVal === 'running' || statusVal === 'started') {
                        badgeClass = "bg-amber-500/10 text-amber-400 border border-amber-500/20";
                      }

                      return (
                        <tr key={index} className="hover:bg-slate-900/30 transition-colors">
                          <td className="px-6 py-3.5 text-sm font-medium text-slate-300">{formattedStart}</td>
                          <td className="px-6 py-3.5">
                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold capitalize ${badgeClass}`}>
                              {record.status || 'unknown'}
                            </span>
                            {record.error_message && (
                              <span className="block text-[10px] text-rose-400/80 font-medium mt-1 truncate max-w-md" title={record.error_message}>
                                {record.error_message}
                              </span>
                            )}
                          </td>
                          <td className="px-6 py-3.5 text-sm text-right font-medium text-slate-300">
                            {record.jobs_found !== null ? record.jobs_found.toLocaleString() : "-"}
                          </td>
                          <td className="px-6 py-3.5 text-sm text-right font-medium text-indigo-400">
                            {record.jobs_inserted !== null ? record.jobs_inserted.toLocaleString() : "-"}
                          </td>
                          <td className="px-6 py-3.5 text-sm text-right font-mono text-slate-400 font-semibold">
                            {formatDuration(record.started_at, record.completed_at)}
                          </td>
                        </tr>
                      );
                    })
                  ) : (
                    <tr>
                      <td colSpan="5" className="px-6 py-12 text-center text-slate-500 font-medium bg-slate-900/10">
                        <div className="flex flex-col items-center justify-center space-y-2">
                          <LucideIcon name="Database" className="w-8 h-8 text-slate-700 animate-pulse" />
                          <span>No scrape logs found in Postgres audit tables.</span>
                        </div>
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // ─── 2. JOBS DIRECTORY VIEW COMPONENT ─────────────────────────────────────────
    const JobsView = ({
      jobsData,
      jobsLoading,
      jobsError,
      searchTerm,
      setSearchTerm,
      selectedCountry,
      setSelectedCountry,
      selectedCategory,
      setSelectedCategory,
      selectedCompany,
      setSelectedCompany,
      sortBy,
      setSortBy,
      sortOrder,
      setSortOrder,
      currentPage,
      setCurrentPage,
      analyticsData,
      filterOptions,
      fetchFilters,
      handleResetFilters,
      onOpenJobModal
    }) => {

      // Fetch fresh filter options each time the Jobs Directory is rendered
      useEffect(() => { if (fetchFilters) fetchFilters(); }, []);

      // Use live /api/v1/filters data for all three dropdowns
      const categories = filterOptions ? filterOptions.categories || [] : [];
      const countries = filterOptions ? filterOptions.countries || [] : [];
      const companies = filterOptions ? filterOptions.companies || [] : [];

      // Calculate total count text
      const pageStartCount = (currentPage - 1) * 20 + 1;
      const pageEndCount = Math.min(currentPage * 20, jobsData.total);

      // Pagination layout calculator
      const paginationPages = useMemo(() => {
        const current = currentPage;
        const total = jobsData.total_pages;
        const range = [];
        const delta = 1; // adjacent page count

        for (let i = 1; i <= total; i++) {
          if (
            i === 1 ||
            i === total ||
            (i >= current - delta && i <= current + delta)
          ) {
            range.push(i);
          }
        }

        const result = [];
        let last = 0;
        for (const page of range) {
          if (last) {
            if (page - last === 2) {
              result.push(last + 1);
            } else if (page - last > 2) {
              result.push('...');
            }
          }
          result.push(page);
          last = page;
        }
        return result;
      }, [currentPage, jobsData.total_pages]);

      return (
        <div className="space-y-6">
          {/* SEARCH & FILTERS CONTROLS */}
          <div className="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-md space-y-4">
            <div className="flex flex-col lg:flex-row gap-4">

              {/* Search Bar */}
              <div className="relative flex-grow">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <LucideIcon name="Search" className="w-5 h-5 text-slate-400" />
                </div>
                <input
                  type="text"
                  placeholder="Search jobs by title, company, description..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full bg-slate-950/60 border border-slate-800/80 rounded-xl pl-11 pr-4 py-2.5 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20 text-white transition-all"
                />
              </div>

              {/* Action Buttons: Reset */}
              <button
                onClick={handleResetFilters}
                className="px-4 py-2.5 bg-slate-900 border border-slate-800/80 hover:border-slate-700 rounded-xl text-sm font-semibold text-slate-300 hover:text-white flex items-center justify-center space-x-2 transition-all"
              >
                <LucideIcon name="XCircle" className="w-4 h-4" />
                <span>Clear Filters</span>
              </button>
            </div>

            {/* Sub Filters grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5">

              {/* Category Dropdown */}
              <div className="flex flex-col space-y-1">
                <label className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Category</label>
                <select
                  value={selectedCategory}
                  onChange={(e) => setSelectedCategory(e.target.value)}
                  className="bg-slate-950/60 border border-slate-800/80 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20"
                >
                  <option value="">All Categories</option>
                  {categories.map((c, i) => (
                    <option key={i} value={c.category}>{c.category} ({c.count})</option>
                  ))}
                </select>
              </div>

              {/* Country Dropdown */}
              <div className="flex flex-col space-y-1">
                <label className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Country</label>
                <select
                  value={selectedCountry}
                  onChange={(e) => setSelectedCountry(e.target.value)}
                  className="bg-slate-950/60 border border-slate-800/80 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20"
                >
                  <option value="">All Countries</option>
                  {countries.map((c, i) => (
                    <option key={i} value={c.country}>{getCountryFlag(c.country)} {c.country} ({c.count})</option>
                  ))}
                </select>
              </div>

              {/* Company Dropdown */}
              <div className="flex flex-col space-y-1">
                <label className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Company</label>
                <select
                  value={selectedCompany}
                  onChange={(e) => setSelectedCompany(e.target.value)}
                  className="bg-slate-950/60 border border-slate-800/80 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20"
                >
                  <option value="">All Companies</option>
                  {companies.map((c, i) => (
                    <option key={i} value={c.company}>{c.company} ({c.count})</option>
                  ))}
                </select>
              </div>

              {/* Sort By Dropdown */}
              <div className="flex flex-col space-y-1">
                <label className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Sort By</label>
                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="bg-slate-950/60 border border-slate-800/80 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20"
                >
                  <option value="published_at">Published Date</option>
                  <option value="scraped_at">Scraped Date</option>
                  <option value="title">Job Title</option>
                  <option value="company_name">Company Name</option>
                </select>
              </div>

              {/* Sort Order Toggle */}
              <div className="flex flex-col space-y-1">
                <label className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Order</label>
                <div className="flex bg-slate-950/60 border border-slate-800/80 rounded-xl p-1">
                  <button
                    onClick={() => setSortOrder('asc')}
                    className={`flex-1 py-1 px-3 text-xs font-semibold rounded-lg transition-all ${sortOrder === 'asc'
                      ? 'bg-slate-800 text-white'
                      : 'text-slate-500 hover:text-slate-300'
                      }`}
                  >
                    Asc
                  </button>
                  <button
                    onClick={() => setSortOrder('desc')}
                    className={`flex-1 py-1 px-3 text-xs font-semibold rounded-lg transition-all ${sortOrder === 'desc'
                      ? 'bg-slate-800 text-white'
                      : 'text-slate-500 hover:text-slate-300'
                      }`}
                  >
                    Desc
                  </button>
                </div>
              </div>

            </div>
          </div>

          {/* TOTAL COUNTER */}
          <div className="flex justify-between items-center text-sm px-1.5">
            <span className="text-slate-400 font-medium">
              {!jobsLoading && jobsData.total > 0 && (
                <>
                  Showing <strong className="text-slate-200">{pageStartCount}-{pageEndCount}</strong> of <strong className="text-indigo-400">{jobsData.total.toLocaleString()}</strong> jobs
                </>
              )}
              {jobsLoading && <span className="inline-block w-48 h-4 bg-slate-900/60 rounded animate-pulse"></span>}
            </span>
          </div>

          {/* JOBS LISTING CONTAINER */}
          {jobsError ? (
            <div className="glass-panel p-8 rounded-2xl border border-rose-500/20 text-center max-w-xl mx-auto my-12 bg-rose-500/5">
              <LucideIcon name="AlertCircle" className="w-12 h-12 text-rose-400 mx-auto mb-4" />
              <h3 className="text-lg font-bold text-white mb-2">Error Retrieving Directory</h3>
              <p className="text-sm text-slate-400 mb-4">{jobsError}</p>
            </div>
          ) : jobsLoading ? (
            /* Loading skeletons */
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {[...Array(6)].map((_, i) => (
                <div key={i} className="glass-panel p-6 rounded-2xl border border-slate-800/80 shadow-md space-y-4 shimmer-effect h-[280px]">
                  <div className="flex justify-between items-start">
                    <div className="space-y-2 w-2/3">
                      <div className="h-5 bg-slate-800/80 rounded w-full"></div>
                      <div className="h-4 bg-slate-800/80 rounded w-1/2"></div>
                    </div>
                    <div className="h-6 bg-slate-800/80 rounded w-16"></div>
                  </div>
                  <div className="h-5 bg-slate-800/80 rounded w-1/3"></div>
                  <div className="flex space-x-2 pt-2">
                    <div className="h-6 bg-slate-800/80 rounded-full w-12"></div>
                    <div className="h-6 bg-slate-800/80 rounded-full w-16"></div>
                    <div className="h-6 bg-slate-800/80 rounded-full w-14"></div>
                  </div>
                  <div className="border-t border-slate-800/40 pt-4 flex space-x-3 mt-6">
                    <div className="h-9 bg-slate-800/80 rounded-lg flex-1"></div>
                    <div className="h-9 bg-slate-800/80 rounded-lg flex-1"></div>
                  </div>
                </div>
              ))}
            </div>
          ) : jobsData.jobs.length === 0 ? (
            /* Empty state */
            <div className="glass-panel p-12 rounded-2xl border border-slate-800/80 text-center max-w-xl mx-auto my-12">
              <LucideIcon name="Briefcase" className="w-16 h-16 text-slate-700 mx-auto mb-4 animate-bounce" strokeWidth={1.5} />
              <h3 className="text-xl font-bold text-white mb-2">No Jobs Found</h3>
              <p className="text-sm text-slate-400 mb-6">We couldn't find any remote jobs matching your search parameters. Try adjusting your keywords or filters.</p>
              <button
                onClick={handleResetFilters}
                className="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl text-sm font-semibold hover:from-blue-500 hover:to-indigo-500 shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2 mx-auto"
              >
                <LucideIcon name="RefreshCw" className="w-4 h-4" />
                <span>Reset All Filters</span>
              </button>
            </div>
          ) : (
            /* Jobs grid cards */
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {jobsData.jobs.map((job) => {
                const flag = getCountryFlag(job.company_country);

                // Click handler specifically avoiding button action conflicts
                const handleCardClick = (e) => {
                  if (e.target.closest('a') || e.target.closest('button')) return;
                  onOpenJobModal(job);
                };

                return (
                  <div
                    key={job.id}
                    onClick={handleCardClick}
                    className="glass-panel p-6 rounded-2xl border border-slate-800/80 shadow-md glass-card-hover cursor-pointer flex flex-col justify-between h-full relative"
                  >
                    <div>
                      {/* Top header row */}
                      <div className="flex justify-between items-start gap-2 mb-3.5">
                        <div className="flex-grow">
                          <h4 className="text-base font-bold text-white leading-tight tracking-tight hover:text-indigo-400 line-clamp-2" title={job.title}>
                            {job.title}
                          </h4>
                          <div className="flex items-center space-x-1.5 text-slate-400 text-xs font-semibold mt-1">
                            <span className="truncate">{job.company_name}</span>
                            <span>•</span>
                            <span className="flex items-center space-x-1">
                              <span>{flag}</span>
                              <span className="text-[11px] truncate max-w-[100px]">{job.company_country || 'Remote'}</span>
                            </span>
                          </div>
                        </div>
                        {/* Category badge */}
                        <span className={`px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider ${getCategoryBadgeClass(job.category)} shrink-0`}>
                          {job.category || 'Other'}
                        </span>
                      </div>

                      {/* Salary pill */}
                      <div className="mb-4">
                        {job.salary ? (
                          <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shadow-glow-emerald">
                            <LucideIcon name="DollarSign" className="w-3.5 h-3.5" />
                            <span>{job.salary}</span>
                          </span>
                        ) : (
                          <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-800/60 text-slate-500 border border-slate-800/40">
                            <span>Salary not disclosed</span>
                          </span>
                        )}
                      </div>

                      {/* Skills tags */}
                      <div className="flex flex-wrap gap-1.5 mb-6">
                        {job.key_preferences && job.key_preferences.length > 0 ? (
                          job.key_preferences.slice(0, 4).map((pref, i) => (
                            <span key={i} className="text-[10px] font-bold bg-slate-950/70 text-indigo-300 border border-indigo-500/10 px-2 py-0.5 rounded-md shadow-sm">
                              {pref}
                            </span>
                          ))
                        ) : (
                          <span className="text-[10px] text-slate-600 italic">No specific skills listed</span>
                        )}
                      </div>
                    </div>

                    {/* Bottom Metadata & CTA Action row */}
                    <div className="border-t border-slate-800/40 pt-4 mt-auto">
                      <div className="flex items-center justify-between mb-4">
                        <span className="text-[11px] text-slate-500 font-semibold flex items-center space-x-1">
                          <LucideIcon name="Clock" className="w-3.5 h-3.5 text-slate-600" />
                          <span>Published {formatRelativeTime(job.published_at)}</span>
                        </span>
                      </div>

                      <div className="flex space-x-3.5">
                        <a
                          href={job.job_link}
                          target="_blank"
                          rel="noreferrer"
                          className="flex-1 px-3 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 hover:bg-slate-800 rounded-xl text-xs font-bold text-slate-300 hover:text-white text-center flex items-center justify-center space-x-1 shadow-sm transition-all"
                        >
                          <LucideIcon name="ExternalLink" className="w-3 h-3" />
                          <span>View Job</span>
                        </a>
                        <a
                          href={job.application_url || job.job_link}
                          target="_blank"
                          rel="noreferrer"
                          className="flex-1 px-3 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl text-xs font-bold text-white text-center flex items-center justify-center space-x-1 shadow-md shadow-indigo-600/10 hover:shadow-indigo-600/20 transition-all"
                        >
                          <LucideIcon name="Send" className="w-3 h-3" />
                          <span>Apply Now</span>
                        </a>
                      </div>
                    </div>

                  </div>
                );
              })}
            </div>
          )}

          {/* PAGINATION FOOTER CONTROL */}
          {!jobsLoading && jobsData.total_pages > 1 && (
            <div className="flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-900/60 pt-6 mt-4">
              <span className="text-xs text-slate-500 font-medium">
                Page <strong className="text-slate-300">{currentPage}</strong> of <strong className="text-slate-300">{jobsData.total_pages}</strong>
              </span>

              <div className="flex items-center space-x-1.5">
                {/* Previous */}
                <button
                  onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                  disabled={currentPage === 1}
                  className="p-2.5 bg-slate-950 border border-slate-800/80 rounded-xl text-slate-400 hover:text-white disabled:opacity-30 disabled:pointer-events-none hover:bg-slate-900/60 transition-all"
                >
                  <LucideIcon name="ChevronLeft" className="w-4 h-4" />
                </button>

                {/* Page range list */}
                {paginationPages.map((page, idx) => {
                  if (page === '...') {
                    return (
                      <span key={idx} className="px-3 py-1.5 text-slate-600 text-sm font-bold">
                        ...
                      </span>
                    );
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => setCurrentPage(Number(page))}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${currentPage === page
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                        : 'bg-slate-950 border border-slate-800/80 text-slate-400 hover:text-white hover:bg-slate-900/60'
                        }`}
                    >
                      {page}
                    </button>
                  );
                })}

                {/* Next */}
                <button
                  onClick={() => setCurrentPage(prev => Math.min(prev + 1, jobsData.total_pages))}
                  disabled={currentPage === jobsData.total_pages}
                  className="p-2.5 bg-slate-950 border border-slate-800/80 rounded-xl text-slate-400 hover:text-white disabled:opacity-30 disabled:pointer-events-none hover:bg-slate-900/60 transition-all"
                >
                  <LucideIcon name="ChevronRight" className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── 3. ANALYTICS VIEW COMPONENT ─────────────────────────────────────────────
    const AnalyticsView = ({ analyticsData, analyticsLoading, analyticsError, healthStatus }) => {
      if (analyticsLoading) {
        return (
          <div className="space-y-6">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
              {[...Array(6)].map((_, i) => (
                <div key={i} className="glass-panel p-5 rounded-2xl border border-slate-800/80 shimmer-effect h-24"></div>
              ))}
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="glass-panel p-6 rounded-2xl border border-slate-800/80 shimmer-effect h-[300px]"></div>
              <div className="glass-panel p-6 rounded-2xl border border-slate-800/80 shimmer-effect h-[300px]"></div>
            </div>
          </div>
        );
      }

      if (analyticsError) {
        return (
          <div className="glass-panel p-8 rounded-2xl border border-rose-500/20 text-center max-w-xl mx-auto my-12 bg-rose-500/5">
            <LucideIcon name="AlertTriangle" className="w-12 h-12 text-rose-400 mx-auto mb-4" />
            <h3 className="text-lg font-bold text-white mb-2">Analytics Sync Failed</h3>
            <p className="text-sm text-slate-400">{analyticsError}</p>
          </div>
        );
      }

      const topSkills = analyticsData.top_skills || [];
      const topCompanies = analyticsData.top_companies || [];
      const topCountries = analyticsData.top_countries || [];
      const dailyGrowth = analyticsData.daily_growth || [];
      const scrapeHistory = analyticsData.scrape_history || [];

      // Donut skills details
      const skillLabels = topSkills.slice(0, 10).map(x => x.skill);
      const skillCounts = topSkills.slice(0, 10).map(x => x.count);

      // Horizontal companies details
      const companyLabels = topCompanies.slice(0, 10).map(x => x.company);
      const companyCounts = topCompanies.slice(0, 10).map(x => x.count);

      // Horizontal countries details
      const countryLabels = topCountries.slice(0, 10).map(x => x.country);
      const countryCounts = topCountries.slice(0, 10).map(x => x.count);

      // Daily Growth chron details
      const sortedGrowth = [...dailyGrowth]
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .slice(-14);
      const growthLabels = sortedGrowth.map(x => {
        try {
          const parts = x.date.split('-');
          return `${parts[1]}/${parts[2]}`;
        } catch (e) {
          return x.date;
        }
      });
      const growthCounts = sortedGrowth.map(x => x.jobs_scraped);

      return (
        <div>
          {/* Stats top bar */}
          <MetricsGrid stats={analyticsData} apiStatus={healthStatus} />

          {/* Charts grid */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">

            {/* Top Skills Donut */}
            <div className="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-md">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center space-x-2">
                  <LucideIcon name="Lightbulb" className="w-4 h-4 text-indigo-400" />
                  <span>Top 10 Required Skills</span>
                </h3>
                <span className="text-[10px] text-violet-400 bg-violet-500/10 px-2 py-0.5 rounded-full font-bold border border-violet-500/20">Skill Density</span>
              </div>
              <DoughnutChart labels={skillLabels} data={skillCounts} />
            </div>

            {/* Top Companies Horizontal Bar */}
            <div className="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-md">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center space-x-2">
                  <LucideIcon name="Building2" className="w-4 h-4 text-indigo-400" />
                  <span>Top Hiring Companies</span>
                </h3>
                <span className="text-[10px] text-violet-400 bg-violet-500/10 px-2 py-0.5 rounded-full font-bold border border-violet-500/20">Leaderboard</span>
              </div>
              <BarChart labels={companyLabels} data={companyCounts} datasetLabel="Jobs Count" horizontal={true} />
            </div>

                      const formattedEnd = record.completed_at
                        ? new Date(record.completed_at).toLocaleString()
                        : "N/A";
                      const statusVal = (record.status || 'unknown').toLowerCase();

                      let badgeClass = "bg-slate-500/10 text-slate-400 border border-slate-500/20";
                      if (statusVal === 'success' || statusVal === 'completed') {
                        badgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shadow-glow-emerald";
                      } else if (statusVal === 'failed' || statusVal === 'error') {
                        badgeClass = "bg-rose-500/10 text-rose-400 border border-rose-500/20";
                      } else if (statusVal === 'running' || statusVal === 'started') {
                        badgeClass = "bg-amber-500/10 text-amber-400 border border-amber-500/20";
                      }

                      return (
                        <tr key={index} className="hover:bg-slate-900/30 transition-colors">

    // ─── 3.5 ON-DEMAND SCRAPER VIEW COMPONENT ────────────────────────────────────
    const ScraperFormView = ({ onOpenJobModal, fetchAnalytics, fetchJobs, apiKey }) => {
      const [location, setLocation] = useState('');
      const [category, setCategory] = useState('');
      const [skill, setSkill] = useState('');

      const [limit, setLimit] = useState(30);
      const [proxyUrl, setProxyUrl] = useState(localStorage.getItem('remoteio_proxy_url') || '');
      const [meta, setMeta] = useState({ total_pages: 0, total_jobs: 0, loading: false });

      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [results, setResults] = useState([]);
      const [scrapeStats, setScrapeStats] = useState(null);
      const [lastTaskId, setLastTaskId] = useState(null); // task_id from last completed scrape
      const [scrapedPagesCount, setScrapedPagesCount] = useState(0);

      // Simulate scraping progress
      useEffect(() => {
        if (!loading) return;
        const target = (limit === '0' || limit === 0) ? Math.max(meta.total_pages, 1) : Math.max(parseInt(limit) / 30, 1);

        const interval = setInterval(() => {
          setScrapedPagesCount(prev => {
            if (prev < target - 1) return prev + 1; // Don't reach target until actually done
            return prev;
          });
        }, 2000); // Tick a page every 2 seconds for visual feedback
        return () => clearInterval(interval);
      }, [loading, limit, meta.total_pages]);

      // Pagination for results
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 4;
      const totalPages = Math.ceil(results.length / itemsPerPage);
      const paginatedResults = useMemo(() => {
        const start = (currentPage - 1) * itemsPerPage;
        return results.slice(start, start + itemsPerPage);
      }, [results, currentPage]);

      const paginationPages = useMemo(() => {
        const range = [];
        const delta = 1;
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || (i >= currentPage - delta && i <= currentPage + delta)) {
            range.push(i);
          }
        }
        const result = [];
        let last = 0;
        for (const page of range) {
          if (last) {
            if (page - last === 2) result.push(last + 1);
            else if (page - last > 2) result.push('...');
          }
          result.push(page);
          last = page;
        }
        return result;
      }, [currentPage, totalPages]);

      // Fetch metadata when parameters change to estimate scrape size
      useEffect(() => {
        let isMounted = true;
        const fetchMeta = async () => {
          setMeta(prev => ({ ...prev, loading: true }));
          try {
            const res = await fetch(`${API_BASE}/api/v1/jobs/scrape/metadata`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                ...(apiKey ? { 'X-API-Key': apiKey } : {})
              },
              body: JSON.stringify({
                location: location.trim() || null,
                category: category || null,
                skill: skill.trim() || null,
                location_type: locationType || null,
                salary: salary || null,
              })
            });
            if (!res.ok) throw new Error();
            const data = await res.json();
            if (isMounted) {
              setMeta({
                total_pages: data.total_pages,
                total_jobs: data.total_jobs,
                loading: false
              });
            }
          } catch (err) {
            if (isMounted) {
              setMeta({ total_pages: 0, total_jobs: 0, loading: false });
            }
          }
        };

        const timer = setTimeout(() => {
          fetchMeta();
        }, 400);

        return () => {
          isMounted = false;
          clearTimeout(timer);
        };
      }, [location, category, skill, locationType, salary]);

      // Reset custom limits if metadata updates
      useEffect(() => {
        if (limit !== 30 && limit !== 0 && limit !== '30' && limit !== '0') {
          setLimit(30);
        }
      }, [meta]);

      const renderLimitOptions = () => {
        if (meta.loading) {
          return <option value="30">Calculating available pages...</option>;
        }
        if (meta.total_pages === 0) {
          return (
            <>
              <option value="30">30 jobs (1 Page)</option>
              <option value="0">All Pages (Unknown limit)</option>
            </>
          );
        }

        const options = [];
        const totalP = meta.total_pages;
        const totalJ = meta.total_jobs;

        // Add "All Pages"
        options.push({ value: "0", label: `All Pages (${totalJ} jobs / ${totalP} ${totalP === 1 ? 'Page' : 'Pages'})` });

        // Standard step list
        const pageSteps = [1, 2, 3, 5, 10, 15, 20, 30, 50, 100];

        pageSteps.forEach(p => {
          if (p <= totalP) {
            const jobCount = Math.min(p * 30, totalJ);
            if (p < totalP) {
              options.push({
                value: String(p * 30),
                label: `${p * 30} jobs (${p} ${p === 1 ? 'Page' : 'Pages'})`
              });
            }
          }
        });

        // Add custom option for exact limit if not in pageSteps
        const isStandardPage = pageSteps.includes(totalP);
        if (!isStandardPage && totalP > 1) {
          options.push({
            value: String(totalJ),
            label: `${totalJ} jobs (${totalP} Pages)`
          });
        }

        const sortedOptions = options.slice(1).sort((a, b) => parseInt(a.value) - parseInt(b.value));

        return (
          <>
            {sortedOptions.map((opt, idx) => (
              <option key={idx} value={opt.value}>{opt.label}</option>
            ))}
            <option value="0">{options[0].label}</option>
          </>
        );
      };

      const handleScrape = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        setScrapeStats(null);
        setResults([]);
        setScrapedPagesCount(0);

        try {
          // ── Step 1: Dispatch the scrape task (returns instantly with task_id) ──
          const response = await fetch(`${API_BASE}/api/v1/jobs/scrape`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(apiKey ? { 'X-API-Key': apiKey } : {})
            },
            body: JSON.stringify({
              location: location.trim() || null,
              category: category || null,
              skill: skill.trim() || null,
              location_type: locationType || null,
              salary: salary || null,
              limit: parseInt(limit, 10),
              proxy_url: proxyUrl.trim() || null,
            }),
          });

          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.detail || `Server responded with status: ${response.status}`);
          }

          const dispatched = await response.json();
          const taskId = dispatched.task_id;

          // ── Step 2: Poll /scrape/status/{task_id} every 2s until done ────────
          const maxWaitMs = 10 * 60 * 1000; // 10 minute hard cap
          const deadline = Date.now() + maxWaitMs;
          let finalResult = null;

          while (Date.now() < deadline) {
            await new Promise(r => setTimeout(r, 2000));
            const poll = await fetch(`${API_BASE}/api/v1/jobs/scrape/status/${taskId}`);
            const pollData = await poll.json();

            if (pollData.status === 'success') {
              finalResult = pollData.result;
              break;
            }
            if (pollData.status === 'failed') {
              throw new Error(pollData.error || 'Scrape worker task failed');
            }
            // still pending/running — keep polling
          }

          if (!finalResult) throw new Error('Scrape timed out after 10 minutes');

          // ── Step 3: Fetch the freshly-saved jobs from the DB to show in UI ──
          const jobsRes = await fetch(
            `${API_BASE}/api/v1/jobs/?page=1&page_size=100&sort_by=scraped_at&sort_order=desc`
          );
          const jobsData = jobsRes.ok ? await jobsRes.json() : { jobs: [] };

          setResults(jobsData.jobs || []);
          setCurrentPage(1);
          setLastTaskId(finalResult.task_id || null); // save for export buttons
          setScrapeStats({
            jobsFound: finalResult.jobs_found,
            jobsInserted: finalResult.jobs_inserted,
            duration: finalResult.duration_seconds
          });

          // Refresh parent analytics/jobs telemetry so everything is in sync
          fetchAnalytics();
          fetchJobs();
        } catch (err) {
          setError(err.message || 'An unexpected error occurred during scraping.');
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

                  />

                {/* Submit button */}
                <div style={{ position: 'relative', zIndex: 1 }}>
                  <button
                    type="submit"
                    disabled={loading}
                    className={`w-full py-2 rounded-xl text-sm font-bold text-white transition-all flex items-center justify-center space-x-2 shadow-lg h-[38px] mt-2.5 ${loading
                      ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700/50 shadow-none'
                      : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 shadow-indigo-600/30'

              {/* Status alerts */}
